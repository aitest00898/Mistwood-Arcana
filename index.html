<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#071611" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="霧林秘典" />
    <meta name="description" content="霧林秘典：原創直式 Roguelike 生存遊戲" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%pwa/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa/icon-192.png" />
    <style>
      /* Critical boot UI: this remains visible even while the main stylesheet
         and Canvas module are still downloading on a mobile browser. */
      :root { color-scheme: dark; }
      html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #06130e; }
      #game-shell { position: fixed; inset: 0; overflow: hidden; background: #06130e; }
      #game-canvas { display: block; width: 100%; height: 100%; }
      #loading { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; color: #f3ead7; background: radial-gradient(circle at 50% 38%, #204b35 0%, #0a2419 43%, #030b08 100%); font: 600 14px/1.5 "Trebuchet MS", "PingFang TC", sans-serif; text-align: center; transition: opacity .28s ease; }
      #loading-card { width: min(84vw, 320px); padding: 30px 24px 24px; border: 1px solid rgba(211, 181, 112, .64); border-radius: 18px; background: rgba(5, 20, 14, .78); box-shadow: 0 18px 60px rgba(0, 0, 0, .38), inset 0 0 28px rgba(91, 160, 104, .08); }
      #loading-sigil { width: 44px; height: 44px; margin: 0 auto 18px; border: 2px solid rgba(222, 202, 151, .25); border-top-color: #cba967; border-right-color: #85d0a0; border-radius: 50%; animation: mistwood-spin 1.1s linear infinite; }
      #loading-title { letter-spacing: .12em; font-size: 17px; }
      #loading-detail { min-height: 22px; margin-top: 7px; color: rgba(226, 235, 215, .7); font-size: 11px; }
      #loading-progress { width: 100%; height: 6px; margin-top: 19px; overflow: hidden; border-radius: 99px; background: rgba(1, 8, 5, .78); box-shadow: inset 0 0 0 1px rgba(228, 210, 159, .18); }
      #loading-progress-fill { width: 10%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6fbd86, #e0c079); box-shadow: 0 0 12px rgba(149, 226, 165, .72); transition: width .22s ease; }
      #loading-progress-fill.indeterminate { width: 36%; animation: mistwood-loading 1.35s ease-in-out infinite; }
      #loading-reload { display: none; margin: 18px auto 0; padding: 9px 20px; border: 1px solid rgba(203, 169, 103, .8); border-radius: 999px; color: #f8efd9; background: rgba(111, 189, 134, .15); font: 600 13px "Trebuchet MS", "PingFang TC", sans-serif; }
      #loading-reload.visible { display: inline-block; }
      @keyframes mistwood-spin { to { transform: rotate(360deg); } }
      @keyframes mistwood-loading { 0% { transform: translateX(-120%); } 50%, 75% { transform: translateX(180%); } 100% { transform: translateX(300%); } }
    </style>
    <title>霧林秘典 · Mistwood Arcana</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" aria-label="霧林秘典遊戲畫面"></canvas>
      <div id="loading" role="status" aria-live="polite">
        <div id="loading-card">
          <div id="loading-sigil" aria-hidden="true"></div>
          <div id="loading-title">正在喚醒霧林…</div>
          <div id="loading-detail">正在等待遊戲程式啟動</div>
          <div id="loading-progress" aria-label="遊戲載入進度"><div id="loading-progress-fill"></div></div>
          <button id="loading-reload" type="button">重新整理</button>
        </div>
      </div>
      <pre id="mistwood-perf-output" aria-label="效能測試結果" hidden></pre>
    </main>
    <script>
      (function () {
        var title = document.getElementById('loading-title');
        var detail = document.getElementById('loading-detail');
        var reload = document.getElementById('loading-reload');
        if (reload) reload.addEventListener('click', function () { window.location.reload(); });
        window.__mistwoodBootStarted = false;
        window.setTimeout(function () {
          if (window.__mistwoodBootStarted || !title || !detail || !reload) return;
          title.textContent = '遊戲程式仍在等待…';
          detail.textContent = '若畫面未變化，請點擊重新整理';
          reload.classList.add('visible');
        }, 8000);
      }());
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
